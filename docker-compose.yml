version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sandwich_copilot
      POSTGRES_USER: sandwich
      POSTGRES_PASSWORD: sandwich_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandwich -d sandwich_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sandwich:sandwich_dev_password@postgres:5432/sandwich_copilot
      - DATABASE_SYNC_URL=postgresql://sandwich:sandwich_dev_password@postgres:5432/sandwich_copilot
      - ENVIRONMENT=development
      - SECRET_KEY=dev-secret-key-change-in-production
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-dev-jwt-secret}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - CONFIDENCE_THRESHOLD=0.90
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  worker:
    build:
      context: .
      target: development
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://sandwich:sandwich_dev_password@postgres:5432/sandwich_copilot
      - DATABASE_SYNC_URL=postgresql://sandwich:sandwich_dev_password@postgres:5432/sandwich_copilot
      - ENVIRONMENT=development
      - SECRET_KEY=dev-secret-key-change-in-production
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-dev-jwt-secret}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - CONFIDENCE_THRESHOLD=0.90
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: sandwich_copilot
      MB_DB_PORT: 5432
      MB_DB_USER: sandwich
      MB_DB_PASS: sandwich_dev_password
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - metabase

volumes:
  postgres_data:
