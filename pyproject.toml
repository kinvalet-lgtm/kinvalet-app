[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandwich-copilot"
version = "0.1.0"
description = "AI-powered family operations platform for the Sandwich Generation"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # Settings
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.10.0",
    # Job queue (Postgres-backed, no Redis)
    "procrastinate[aiopg]>=2.10.0",
    # LLM access
    "litellm>=1.56.0",
    # Twilio (WhatsApp)
    "twilio>=9.3.0",
    # Auth (Supabase JWT validation)
    "PyJWT[crypto]>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    # HTTP client
    "httpx>=0.27.0",
    # Observability
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # Utilities
    "python-multipart>=0.0.18",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "phonenumbers>=8.13.50",
    "pillow>=11.0.0",
    # Google APIs
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.154.0",
    # Microsoft (MSAL for Graph API)
    "msal>=1.31.0",
    # Google Maps
    "googlemaps>=4.10.0",
    # Plaid
    "plaid-python>=28.0.0",
    # Import linting (enforces module boundaries)
    "import-linter>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "freezegun>=1.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "integration: tests that require a real PostgreSQL database",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
