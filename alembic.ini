# Alembic configuration
# Per-module migration directories (§7.3 of architecture doc)
# Each module has its own Alembic env + version table inside its own schema.
# This is the detail that makes extraction nearly free:
# when operations becomes its own service, its migration history travels with it.

[alembic]
# Path to migration scripts
script_location = app/modules/%(module)s/migrations

# Database URL — overridden per-module env.py from settings
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
